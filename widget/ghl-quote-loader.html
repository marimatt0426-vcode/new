<!--
  PURGE PROS GLOBAL QUOTE LOADER
  In GoHighLevel, replace the old single purge-quote.js script tag with this
  entire block. Install it once in the same global HEAD/custom-code location.
-->
<script>
  (function () {
    "use strict";
    var url = new URL(window.location.href);
    var queryValue = String(url.searchParams.get("open_quote") || "").trim().toLowerCase();
    var queryRequested = queryValue === "1" || queryValue === "true" || queryValue === "yes";
    var hashValue = String(url.hash || "").toLowerCase();
    var hashRequested = hashValue === "#quote" || hashValue === "#get-quote";
    if (!queryRequested && !hashRequested) return;

    var root = document.documentElement;
    var className = "pp-quote-auto-opening";
    var styleId = "pp-quote-auto-opening-style";
    if (!root || document.getElementById(styleId)) return;

    var style = document.createElement("style");
    style.id = styleId;
    style.textContent =
      "@keyframes ppQuoteLoaderReveal{from{opacity:0}to{opacity:1}}" +
      "html." + className + "::before{" +
        "content:'';position:fixed;inset:0;z-index:2147482990;" +
        "background:rgba(2,20,32,.82);backdrop-filter:blur(7px);" +
        "animation:ppQuoteLoaderReveal .01s linear .12s both" +
      "}" +
      "html." + className + "::after{" +
        "content:'Opening your 60-second price check...';" +
        "position:fixed;z-index:2147482991;left:50%;top:50%;" +
        "width:min(360px,calc(100% - 40px));padding:22px 24px;" +
        "transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.72);" +
        "border-top:4px solid #38b6ff;border-radius:18px;background:#fff;color:#08283a;" +
        "box-shadow:0 24px 70px rgba(0,0,0,.3);text-align:center;" +
        "font:900 16px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;" +
        "animation:ppQuoteLoaderReveal .01s linear .12s both" +
      "}" +
      "@media(prefers-reduced-motion:reduce){" +
        "html." + className + "::before,html." + className + "::after{animation-delay:0s}" +
      "}";
    (document.head || root).appendChild(style);
    root.classList.add(className);

    window.__ppQuoteInlineLoaderTimeout = window.setTimeout(function () {
      root.classList.remove(className);
      if (style.parentNode) style.parentNode.removeChild(style);
      window.__ppQuoteInlineLoaderTimeout = null;
    }, 12000);
  }());
</script>
<script async src="https://purge-lead-relay.purgepros.workers.dev/purge-quote.js"></script>
