<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purge Pros — Quote Widget Demo</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #0d0f12; color: #fff;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .hero { text-align: center; padding: 40px 20px; }
    .hero h1 { font-size: 40px; margin: 0 0 8px; }
    .hero h1 span { color: #38b6ff; }
    .hero p { color: #b9c2cb; margin: 0 0 28px; }
    .cta { display: inline-block; background: #38b6ff; color: #fff; font-weight: 800; font-size: 17px;
           padding: 16px 34px; border-radius: 999px; text-decoration: none; }
    .cta:hover { background: #1da4f5; }
    .note { margin-top: 24px; font-size: 13px; color: #6c7680; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Purge <span>Pros</span></h1>
    <p>Pet waste removal — pay per visit, no contracts, no monthly billing.</p>
    <a class="cta" href="#quote">Get My Instant Quote</a>
    <p class="note">Leads log to the browser console until <code>leadEndpoint</code> is set in purge-quote.js.<br>
       Try an in-area ZIP (46032) and an out-of-area one (85701).</p>
  </div>
  <script src="purge-quote.js" defer></script>
</body>
</html>
