<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebPage","@id":"https://itspurgepros.com/faq#webpage","url":"https://itspurgepros.com/faq","name":"Dog Waste Removal FAQs | Pricing & Service | Purge Pros","description":"Get answers about Purge Pros pricing, first cleanups, billing, pets, gates and weather. Learn how recurring dog waste removal works before requesting service.","isPartOf":{"@id":"https://itspurgepros.com/#website"}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://itspurgepros.com/"},{"@type":"ListItem","position":2,"name":"FAQ","item":"https://itspurgepros.com/faq"}]}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","@id":"https://itspurgepros.com/faq#faq","isPartOf":{"@id":"https://itspurgepros.com/#website"},"mainEntity":[{"@type":"Question","name":"How do I know whether you service my address?","acceptedAnswer":{"@type":"Answer","text":"Your ZIP is the second question when you build your price. If your ZIP is covered, you can continue through pricing and submit your service request. Because recurring service is route-based, our local team still reviews the full address and current route capacity before confirming your service day. We would rather confirm a dependable route than promise a day we cannot support."}},{"@type":"Question","name":"What yard size should I enter for my quote?","acceptedAnswer":{"@type":"Answer","text":"Estimate the total outdoor area that needs scooping, including side yards, dog runs, and patios or concrete where your dogs go. Leave out the house and areas that do not need scooping. Pricing uses dog count, visit frequency and the requested cleanup area. If that area exceeds one acre or the work falls outside standard options, ask for a custom quote. A larger property does not automatically need a custom quote if the area needing scooping is smaller."}},{"@type":"Question","name":"What happens after I request recurring service?","acceptedAnswer":{"@type":"Answer","text":"Submitting the form requests service; it does not instantly assign a route day. Our local team reviews your address, selected plan, and current route capacity. After your route is approved and a service day is confirmed, we send your service details and a secure Housecall Pro card-on-file link. We contact you using the preference you chose when you built your price."}},{"@type":"Question","name":"Do I have to sign a long-term contract?","acceptedAnswer":{"@type":"Answer","text":"No. There is no minimum number of visits and no cancellation fee. You pay for completed visits, and there is nothing to pay back if you stop. Regular scheduled visits stay at your quoted rate however long they take. After a long pause or repeated customer-requested skips, a restart cleanup may be needed: your quoted visit rate includes the first 30 minutes, then $1 per actual additional minute. We confirm any restart pricing with you before you approve anything."}},{"@type":"Question","name":"How do billing and payment work?","acceptedAnswer":{"@type":"Answer","text":"Recurring service is pay per visit, not a flat monthly bill. After route approval, you receive a secure link to place a major credit or debit card on file. Your card is charged when we text that we are on the way. Any extra minutes are invoiced after the visit: time past 30 minutes on a restart or one-time cleanup, or extra time you agreed to before a first cleanup that needs more than two hours. What you were charged up front counts toward the total; it is not added a second time. Regular scheduled visits are never charged by the minute. Receipts are provided electronically. We do not accept cash or checks left at the property."}},{"@type":"Question","name":"Do you offer one-time cleanups?","acceptedAnswer":{"@type":"Answer","text":"Yes. One-time cleanup is $89.99 for the first 30 minutes, then $1 per actual additional minute. Choose One-time cleanup when you build your price to request service. The $89.99 is charged when we text that we are on the way. Any additional time is invoiced after the visit. The $89.99 is credited toward the total, not charged again. One-time cleanups are priced on their own, separately from recurring service."}},{"@type":"Question","name":"Do I need to be home during service?","acceptedAnswer":{"@type":"Answer","text":"No. As long as the service areas are safely accessible and you provide any gate, pet, or access instructions, you can go about your day. Before we arrive: You receive a heads-up text when the technician is on the way. After service: You receive a gate-closure photo after the visit is completed. Access notes: We follow the approved instructions saved for your property and pets."}},{"@type":"Question","name":"Are you insured, and who performs the service?","acceptedAnswer":{"@type":"Answer","text":"Yes. Purge Pros carries business insurance, and field service is performed by background-checked W-2 employees trained to our service and property-care standards, not random gig workers. You receive a notification before arrival, and the person servicing your property is identifiable as part of the Purge Pros team."}},{"@type":"Question","name":"How do you handle pets, gates, and property access?","acceptedAnswer":{"@type":"Answer","text":"We save your approved pet, gate, and property-access instructions so the technician knows how to enter and secure the service area. Gate security: After the visit, we close the gate and send a photo showing it secured. Pet notes: Treats are provided only when owner-approved, and allergy or no-treat instructions are documented. Sanitation: Tools and footwear are treated between yards to reduce cross-property contamination. Unsafe conditions: Reactive, protective, or escape-risk dogs must remain inside. We may pause a visit if safe service is not possible."}},{"@type":"Question","name":"Do you provide service year-round and during bad weather?","acceptedAnswer":{"@type":"Answer","text":"Yes. We work through ordinary rain, cold, and snow when the yard can be serviced safely. Lightning, flooding, unsafe ice, extreme cold, or another serious hazard may delay or pause service. If weather forces a change, we send an update and try to reschedule. If Purge Pros cancels and cannot reschedule that visit, you are not charged; the accumulated waste is addressed on the next scheduled visit without an extra accumulation charge."}},{"@type":"Question","name":"Can I skip, pause, or reschedule a visit?","acceptedAnswer":{"@type":"Answer","text":"Yes. Contact us as early as possible, preferably at least 48 hours before your route day. We will try to accommodate another day, but a specific alternate day cannot be guaranteed. If your dogs are away and no new waste is accumulating, let us know. If waste continues to accumulate during a long pause or repeated customer-requested skips, we may need a restart cleanup: your quoted visit rate includes the first 30 minutes, then $1 per actual additional minute. We confirm any restart pricing with you before you approve anything; extra time is invoiced after the visit. Regular scheduled visits are never charged by the minute. A Purge Pros weather cancellation is not treated as a customer skip; accumulated waste is handled on the next scheduled visit without an extra accumulation charge."}}]}</script>
