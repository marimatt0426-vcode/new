<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","@id":"https://itspurgepros.com/additional#faq","isPartOf":{"@id":"https://itspurgepros.com/#website"},"mainEntity":[{"@type":"Question","name":"What if my Central Indiana community is not listed?","acceptedAnswer":{"@type":"Answer","text":"Type your ZIP code into the ZIP check anyway. An address near an active route may still be worth a second look, so text us the ZIP code and the street. Outside the listed communities and ZIP codes we cannot promise service."}},{"@type":"Question","name":"Does a Central Indiana ZIP confirm a recurring service day?","acceptedAnswer":{"@type":"Answer","text":"No. A supported ZIP lets you build your price and send a request. Purge Pros still reviews the exact address, the visits you asked for, and current route capacity before confirming a recurring day."}},{"@type":"Question","name":"Why does Purge Pros review routes manually?","acceptedAnswer":{"@type":"Answer","text":"Manual review prevents an automated form from promising a day that does not fit current capacity or drive time. The goal is a recurring route the team can actually maintain."}},{"@type":"Question","name":"What should I include in my request?","acceptedAnswer":{"@type":"Answer","text":"Include the dogs using the yard, total outdoor area to scoop, every front, back, side, patio, or concrete area needing service, preferred frequency, and gate or access details."}},{"@type":"Question","name":"What starting prices should I compare?","acceptedAnswer":{"@type":"Answer","text":"The starting example for one dog, one service area, and up to one-eighth acre is $19.99 per weekly visit. Twice weekly starts at $15.99 per visit for the same example. The dogs, yard, and schedule you choose set your price, or lead to a custom quote. The full price list has every plan."}},{"@type":"Question","name":"Can I request a one-time cleanup?","acceptedAnswer":{"@type":"Answer","text":"Yes. One-time cleanup is $89.99 for the first 30 minutes, then $1 per additional minute. The $89.99 is charged when we text that we are on the way; any additional time is invoiced after the visit. One-time cleanups are priced on their own, separately from recurring service."}},{"@type":"Question","name":"What is included with recurring dog waste removal?","acceptedAnswer":{"@type":"Answer","text":"Recurring visits include a systematic search of the selected service areas, removal and haul-away of the collected dog waste, sanitized tools between properties, arrival communication, and the gate-security routine."}},{"@type":"Question","name":"How is the per-visit price calculated?","acceptedAnswer":{"@type":"Answer","text":"Your price uses dog count, visit frequency, yard size, and the cleanup areas you select, counting any patio or concrete that needs scooping. Leave out the house and areas that do not need scooping. Larger or more complex properties may need a custom quote instead of an instant price."}}]}</script>
