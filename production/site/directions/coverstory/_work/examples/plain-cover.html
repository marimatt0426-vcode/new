<!-- 1. THE ARTICLE. Its cover is the hero's art, so the opening section does not show the cover again. -->
<section class="sec" data-edge="arc-r" id="article" aria-labelledby="article-title">
  <div class="wrap">
    <div class="prose" style="max-width:72ch">
      <h2 class="h3" id="article-title">An example heading</h2>
      <p>The hero of an article shows the article's own cover standing on the drawn lawn, and no mascot pose: the cover carries the flat brown character, and the glossy one never stands beside it. A breadcrumb with a parent ("Yard Guide") puts the linked trail under the facts.</p>
    </div>
  </div>
</section>
