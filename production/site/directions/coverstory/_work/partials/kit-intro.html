<!--# The frame of a family kit page (_work/pages/kit-<name>.html, hero.recipe "kit"): the heading, then the family's own
      component demos, each a <section class="kit"> with a .kit__label, exactly as in kit.html. -->
<div class="wrap kitpage">

  <header class="kit kit--intro" style="border-top:0;padding-top:44px">
    <p class="kicker">Purge Pros website rebuild · direction "Cover Story" · family kit</p>
    <h1 class="h2" style="margin-top:8px">{{title}}</h1>
    <p class="lead" style="margin-top:14px;max-width:62ch">{{lead}}</p>
  </header>

{{sections}}

</div>
