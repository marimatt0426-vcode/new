<style>
  /* Scoped to #pp-hero-trust so nothing leaks into the surrounding GHL page. */
  #pp-hero-trust,
  #pp-hero-trust * {
    box-sizing: border-box;
  }

  #pp-hero-trust {
    position: relative;
    z-index: 1;
    display: block !important;
    width: 100%;
    margin: 0 auto !important;
    padding: 25px 20px;
    border-top: 1px solid rgba(126, 211, 255, 0.2);
    border-bottom: 1px solid rgba(126, 211, 255, 0.14);
    background: linear-gradient(135deg, #062b40 0%, #073652 52%, #05283d 100%);
    box-shadow: 0 15px 35px rgba(3, 34, 51, 0.16);
    font-family: Arial, sans-serif;
    line-height: 1.4;
  }

  #pp-hero-trust .pp-trust-inner {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    align-items: stretch;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
  }

  #pp-hero-trust .pp-trust-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    min-height: 62px;
    padding: 5px 24px;
  }

  #pp-hero-trust .pp-trust-item + .pp-trust-item {
    border-left: 1px solid rgba(198, 233, 250, 0.17);
  }

  #pp-hero-trust .pp-icon-shell {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 43px;
    height: 43px;
    flex: 0 0 43px;
    border: 1px solid rgba(125, 213, 255, 0.34);
    border-radius: 12px;
    background: rgba(56, 182, 255, 0.12);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    color: #60c5ff;
  }

  #pp-hero-trust .pp-icon-shell svg {
    display: block;
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.9;
  }

  #pp-hero-trust .pp-trust-copy {
    min-width: 0;
  }

  #pp-hero-trust .pp-trust-title {
    display: block;
    color: #fff;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.01em;
    line-height: 1.25;
  }

  #pp-hero-trust .pp-trust-detail {
    display: block;
    margin-top: 3px;
    color: #b8d5e3;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.3;
  }

  @media (max-width: 1040px) {
    #pp-hero-trust {
      padding: 20px;
    }

    #pp-hero-trust .pp-trust-inner {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #pp-hero-trust .pp-trust-item {
      padding: 14px 24px;
    }

    #pp-hero-trust .pp-trust-item:nth-child(3) {
      border-left: 0;
    }

    #pp-hero-trust .pp-trust-item:nth-child(n+3) {
      border-top: 1px solid rgba(198, 233, 250, 0.17);
    }
  }

  @media (max-width: 590px) {
    #pp-hero-trust {
      padding: 12px 17px;
    }

    #pp-hero-trust .pp-trust-inner {
      grid-template-columns: 1fr;
    }

    #pp-hero-trust .pp-trust-item {
      min-height: 70px;
      padding: 13px 8px;
      border-left: 0 !important;
    }

    #pp-hero-trust .pp-trust-item + .pp-trust-item {
      border-top: 1px solid rgba(198, 233, 250, 0.17);
    }

    #pp-hero-trust .pp-trust-title {
      font-size: 14px;
    }

    #pp-hero-trust .pp-trust-detail {
      font-size: 11px;
    }
  }
</style>
